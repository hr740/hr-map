<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Factory Radius Checker (5km)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; background: #f4f6f9; }
        header { background: #1e293b; color: white; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
        header h1 { margin: 0; font-size: 18px; display: flex; align-items: center; gap: 8px; }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 360px; background: white; padding: 20px; box-shadow: 2px 0 10px rgba(0,0,0,0.08); overflow-y: auto; z-index: 1000; display: flex; flex-direction: column; gap: 15px; }
        #map { flex: 1; height: 100%; }
        label { font-weight: 600; font-size: 13px; color: #334155; display: block; margin-bottom: 5px; }
        select, input { width: 100%; padding: 10px 12px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; transition: 0.2s; }
        select:focus, input:focus { border-color: #2563eb; }
        select { background: #f8fafc; font-weight: 600; color: #0f172a; cursor: pointer; }
        .btn { width: 100%; padding: 11px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: #2563eb; color: white; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-secondary { background: #e2e8f0; color: #334155; margin-top: 8px; }
        .btn-secondary:hover { background: #cbd5e1; }
        .result-box { padding: 15px; border-radius: 10px; display: none; border-left: 5px solid; }
        .result-within { background: #dcfce7; border-color: #16a34a; color: #14532d; }
        .result-outside { background: #fee2e2; border-color: #dc2626; color: #7f1d1d; }
        .result-title { font-size: 16px; font-weight: 700; margin-bottom: 5px; }
        .result-dist { font-size: 14px; margin-bottom: 10px; }
        .hint { font-size: 12px; color: #64748b; line-height: 1.4; background: #f8fafc; padding: 10px; border-radius: 6px; border: 1px solid #e2e8f0; }
        @media (max-width: 768px) {
            .main-container { flex-direction: column; }
            .sidebar { width: 100%; max-height: 48vh; padding: 15px; }
            #map { height: 52vh; }
        }
    </style>
</head>
<body>

<header>
    <h1>📍 HR Factory 5km Radius Checker</h1>
</header>

<div class="main-container">
    <div class="sidebar">
        <div>
            <label for="factorySelect">1. Factory එක තෝරන්න (Select Factory):</label>
            <select id="factorySelect" onchange="changeFactory()">
                <option value="0">Main Factory (Dambadeniya)</option>
                <option value="1">Loluwagoda Factory</option>
                <option value="2">Waradala Factory</option>
                <option value="3">Pannala Factory</option>
                <option value="4">Thorayaya Factory</option>
            </select>
        </div>

        <div>
            <label for="searchInput">2. සේවකයාගේ ගම හෝ Coordinates:</label>
            <input type="text" id="searchInput" placeholder="උදා: Kuliyapitiya හෝ 7.3120, 80.1450" onkeypress="if(event.key==='Enter') searchLocation()">
            <button class="btn btn-primary" style="margin-top: 8px;" onclick="searchLocation()">Check Location (පරීක්ෂා කරන්න)</button>
        </div>

        <div id="resultBox" class="result-box">
            <div id="resultTitle" class="result-title"></div>
            <div id="resultDist" class="result-dist"></div>
            <button class="btn btn-secondary" onclick="openGoogleMapsDirections()">🚗 Google Maps පාරේ දුර බලන්න</button>
        </div>

        <div class="hint">
            💡 <b>පහසු උපදෙස්:</b><br>
            • ඉහත ලැයිස්තුවෙන් Factory එක මාරු කළ විට 5km රවුම ඉබේම එතැනට මාරු වේ.<br>
            • සිතියම මත ඕනෑම තැනක් <b>Click / Tap</b> කිරීමෙන්ද දුර බැලිය හැක.
        </div>
    </div>

    <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const factories = [
        { name: "Main Factory (Dambadeniya)", lat: 7.373043431372173, lng: 80.15719001325084 },
        { name: "Loluwagoda Factory", lat: 7.308623151932602, lng: 80.13005672149494 },
        { name: "Waradala Factory", lat: 7.271222053796897, lng: 80.04617902922782 },
        { name: "Pannala Factory", lat: 7.348262762847059, lng: 80.0300868150596 },
        { name: "Thorayaya Factory", lat: 7.519008600520468, lng: 80.42570808565769 }
    ];

    const RADIUS_KM = 5;
    let currentFactory = factories[0];
    let empMarker = null;
    let empCoords = null;
    let connectionLine = null;

    const map = L.map('map').setView([currentFactory.lat, currentFactory.lng], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
    }).addTo(map);

    const factoryIcon = L.divIcon({
        html: '<div style="background:#1e293b;color:white;padding:4px 8px;border-radius:6px;font-weight:bold;font-size:11px;white-space:nowrap;border:2px solid white;box-shadow:0 2px 5px rgba(0,0,0,0.3);">🏭 Factory</div>',
        className: '',
        iconAnchor: [35, 15]
    });

    let factoryMarker = L.marker([currentFactory.lat, currentFactory.lng], { icon: factoryIcon }).addTo(map);
    let radiusCircle = L.circle([currentFactory.lat, currentFactory.lng], {
        color: '#2563eb',
        fillColor: '#3b82f6',
        fillOpacity: 0.15,
        radius: RADIUS_KM * 1000
    }).addTo(map);

    function changeFactory() {
        const idx = document.getElementById('factorySelect').value;
        currentFactory = factories[idx];

        factoryMarker.setLatLng([currentFactory.lat, currentFactory.lng]);
        radiusCircle.setLatLng([currentFactory.lat, currentFactory.lng]);
        map.setView([currentFactory.lat, currentFactory.lng], 12);

        if (empCoords) {
            evaluateEmployee(empCoords.lat, empCoords.lng);
        }
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function evaluateEmployee(lat, lng) {
        empCoords = { lat, lng };
        const dist = calculateDistance(currentFactory.lat, currentFactory.lng, lat, lng);
        const isWithin = dist <= RADIUS_KM;

        if (empMarker) map.removeLayer(empMarker);
        if (connectionLine) map.removeLayer(connectionLine);

        empMarker = L.marker([lat, lng]).addTo(map)
            .bindPopup(`<b>සේවකයාගේ ස්ථානය</b><br>දුර: ${dist.toFixed(2)} km`).openPopup();

        connectionLine = L.polyline([[currentFactory.lat, currentFactory.lng], [lat, lng]], {
            color: isWithin ? '#16a34a' : '#dc2626',
            weight: 3,
            dashArray: '6, 6'
        }).addTo(map);

        const resultBox = document.getElementById('resultBox');
        const resultTitle = document.getElementById('resultTitle');
        const resultDist = document.getElementById('resultDist');

        resultBox.style.display = 'block';
        if (isWithin) {
            resultBox.className = 'result-box result-within';
            resultTitle.innerText = '✅ WITHIN 5 KM (සීමාව ඇතුළත)';
        } else {
            resultBox.className = 'result-box result-outside';
            resultTitle.innerText = '❌ OUTSIDE 5 KM (සීමාවෙන් පිටත)';
        }
        resultDist.innerHTML = `<b>${currentFactory.name}</b> සිට සෘජු දුර: <b>${dist.toFixed(2)} km</b>`;

        const bounds = L.latLngBounds([[currentFactory.lat, currentFactory.lng], [lat, lng]]);
        map.fitBounds(bounds, { padding: [50, 50] });
    }

    async function searchLocation() {
        const query = document.getElementById('searchInput').value.trim();
        if (!query) return;

        const coordMatch = query.match(/^(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)$/);
        if (coordMatch) {
            evaluateEmployee(parseFloat(coordMatch[1]), parseFloat(coordMatch[2]));
            return;
        }

        try {
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query + ', Sri Lanka')}`);
            const data = await res.json();
            if (data && data.length > 0) {
                evaluateEmployee(parseFloat(data[0].lat), parseFloat(data[0].lon));
            } else {
                alert('ස්ථානය සොයාගත නොහැකි විය. ගමේ නම නිවැරදිව දමන්න හෝ Coordinates ලබා දෙන්න.');
            }
        } catch (e) {
            alert('Internet සම්බන්ධතාවය පරීක්ෂා කරන්න.');
        }
    }

    function openGoogleMapsDirections() {
        if (!empCoords) return;
        const url = `https://www.google.com/maps/dir/?api=1&origin=${currentFactory.lat},${currentFactory.lng}&destination=${empCoords.lat},${empCoords.lng}`;
        window.open(url, '_blank');
    }

    map.on('click', function(e) {
        evaluateEmployee(e.latlng.lat, e.latlng.lng);
    });
</script>

</body>
</html>
